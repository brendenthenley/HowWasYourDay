<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily Photos — Login</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card" style="width:100%; max-width:360px;">
      <h1 style="margin-top:0;">Daily Photos</h1>
      <form id="login-form">
        <input type="password" id="passcode" placeholder="Passcode" autocomplete="current-password" autofocus />
        <div class="error-text" id="error"></div>
        <button type="submit">Enter</button>
      </form>
    </div>
  </div>

<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const passcode = document.getElementById('passcode').value;
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode }),
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      errorEl.textContent = 'Wrong passcode';
    }
  });
</script>
</body>
</html>
